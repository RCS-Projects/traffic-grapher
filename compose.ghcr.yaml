services:
  traffic-grapher:
    image: ghcr.io/rcs-projects/traffic-grapher:latest
    container_name: traffic-grapher
    network_mode: host
    restart: unless-stopped
    environment:
      CONFIG_DIR: /data
      PORT: "8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
